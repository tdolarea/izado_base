<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Izado y Arriado en Tierra</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#070d1e;color:#f1f5f9;min-height:100vh}header{background:#0f172a;border-bottom:2px solid #1e3a8a;padding:12px;text-align:center;font-weight:800;color:#38bdf8}main{padding:14px;max-width:800px;margin:0 auto}.section{background:#0f172a;border:1px solid #1e3a8a;border-radius:10px;padding:14px;margin-bottom:14px}.section h2{font-size:12px;font-weight:800;color:#38bdf8;margin-bottom:10px;text-transform:uppercase}.reloj{background:#1a2332;border:2px solid #0284c7;border-radius:8px;padding:12px;text-align:center;font-size:16px;font-weight:800;color:#38bdf8;font-family:monospace;margin-bottom:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin-bottom:12px}button{background:#1e293b;border:1.5px solid #334155;color:#f8fafc;padding:12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;width:100%;margin-bottom:8px;transition:0.15s}button:active{background:#0284c7;border-color:#38bdf8}button.primary{background:#0c4a6e;border-color:#0284c7}.status-bar{background:#7f1d1d;border:2px solid #ef4444;border-radius:8px;padding:12px;color:#fef2f2;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.stop-btn{background:#dc2626;padding:8px 16px;border-radius:6px;color:white;font-weight:900;cursor:pointer;border:none;font-size:12px}#puntosGrid{display:grid;gap:8px}#seccionOracion{display:none;margin-top:12px;padding:12px;background:#0b152d;border-radius:8px;border-left:3px solid #f59e0b}</style></head><body><header>⚓ Izado y Arriado en Tierra</header><main><div class="section"><h2>⚙️ Evento</h2><div class="reloj" id="reloj">--:--:-- Z</div><div class="grid2"><button class="primary" id="btnIzado" onclick="setModo('izado')">📌 IZADO</button><button id="btnArriado" onclick="setModo('arriado')">📖 ARRIADO</button></div><button id="btnGuardia" onclick="setGuardia(!conGuardia)" style="width:100%">💂 GUARDIA: SÍ</button></div><div class="section"><h2>🎵 Opciones</h2><div class="grid4"><button onclick="setAcompañamiento('himno')">🎵 HIMNO</button><button onclick="setAcompañamiento('corneta')">📯 CORNETA</button><button onclick="setAcompañamiento('chifle')">🎺 CHIFLE</button><button onclick="setAcompañamiento('himno_chifle')">H+C</button></div><div id="seccionOracion"><h2 style="margin:0 0 10px 0">✝️ ORACIÓN</h2><div class="grid4"><button onclick="setOracion('corneta')">📯 CORNETA</button><button onclick="setOracion('musica')">🎵 CANTADA</button><button onclick="setOracion('leida')">📖 LEÍDA</button><button onclick="setOracion('ninguna')">⊘ NINGUNA</button></div></div></div><div class="section"><h2>⏸️ Secuencia Manual</h2><div class="status-bar"><span id="status">LISTO</span><button class="stop-btn" onclick="stopAll()">⏹️ STOP</button></div><div id="puntosGrid"></div></div><div class="section"><button class="primary" style="padding:16px;font-size:14px;background:#0284c7;border-color:#38bdf8;width:100%" onclick="iniciarAuto()">▶️ INICIAR SECUENCIA CONTINUA</button></div></main><audio id="audioPlayer"></audio><script>let modo='izado',conGuardia=true,acompañamiento='himno',oracion='corneta';let cerPuntosActivosManualIAA=[];const audioURLs={'1_izado':'audios/01_01_senales_izado.mp3','1_arriado':'audios/01_02_senales_arriado.mp3','2':'audios/02_firmes.mp3','3_voz':'audios/03_01_presenten_voz.mp3','3_corneta':'audios/03_02_presenten_corneta.wav','4':'audios/04_ejecutiva.wav','5_himno':'audios/05_01_himno.mp3','5_chifle':'audios/05_02_chifle.mp3','5_corneta':'audios/05_03_corneta.wav','5_himno_chifle':'audios/05_04_himno_chifle.mp3','6':'audios/06_descansen.wav','7':'audios/07_envainen.wav','8_corneta':'audio/event08_01_CornetaToquedeOracion.wav','8_musica':'audio/event08_02_Oracion_CANTADA.mp3','8_leida':'audio/event08_03_VOZORACION.mp3'};const nombres={1:'📻 SEÑALES',2:'🫡 PRESENTEN',3:'🎙️ ORDEN',4:'🎵 ACOMPAÑAMIENTO',5:'🎼 HIMNO',6:'🫡 DESCANSEN',7:'🗡️ ENVAINEN',8:'✝️ ORACIÓN'};function actualizarReloj(){const a=new Date();const h=-(a.getTimezoneOffset()/60);const l=['Y','X','W','V','U','Z','A','B','C','D','E','F','G','H','I','K','L','M'][h+12]||'Z';document.getElementById('reloj').textContent=String(a.getHours()).padStart(2,'0')+':'+String(a.getMinutes()).padStart(2,'0')+':'+String(a.getSeconds()).padStart(2,'0')+' '+l;}actualizarReloj();setInterval(actualizarReloj,1000);function setModo(m){modo=m;calcularPuntos();document.getElementById('btnIzado').className=m==='izado'?'primary':'';document.getElementById('btnArriado').className=m==='arriado'?'primary':'';}function setGuardia(g){conGuardia=g;calcularPuntos();document.getElementById('btnGuardia').textContent='💂 GUARDIA: '+(g?'SÍ':'NO');}function setAcompañamiento(a){acompañamiento=a;calcularPuntos();}function setOracion(o){oracion=o;}function calcularPuntos(){const h=(acompañamiento==='himno'||acompañamiento==='himno_chifle');cerPuntosActivosManualIAA=[];if(modo==='izado'){if(conGuardia){cerPuntosActivosManualIAA=[1,2,3,5,6,7];if(h)cerPuntosActivosManualIAA.splice(3,0,4);}else{cerPuntosActivosManualIAA=[1,5];if(h)cerPuntosActivosManualIAA.splice(1,0,4);}document.getElementById('seccionOracion').style.display='none';}else{if(conGuardia){cerPuntosActivosManualIAA=[1,2,3,5,6,7,8];if(h)cerPuntosActivosManualIAA.splice(3,0,4);}else{cerPuntosActivosManualIAA=[1,5,8];if(h)cerPuntosActivosManualIAA.splice(1,0,4);}document.getElementById('seccionOracion').style.display='block';}renderPuntos();}function renderPuntos(){const g=document.getElementById('puntosGrid');g.innerHTML='';for(let p of cerPuntosActivosManualIAA){const b=document.createElement('button');b.textContent='PUNTO '+p+': '+nombres[p];b.onclick=()=>reproducirPunto(p);g.appendChild(b);}}function getAudioURL(p){if(p===1)return modo==='izado'?audioURLs['1_izado']:audioURLs['1_arriado'];if(p===3)return audioURLs['3_voz'];if(p===5)return audioURLs['5_'+acompañamiento]||audioURLs['5_himno'];if(p===8){if(oracion==='ninguna')return '';if(oracion==='corneta')return audioURLs['8_corneta'];if(oracion==='musica')return audioURLs['8_musica'];if(oracion==='leida')return audioURLs['8_leida'];return '';}return audioURLs[p]||'';}function reproducirPunto(p){const u=getAudioURL(p);if(u){const a=document.getElementById('audioPlayer');a.src=u;a.play();document.getElementById('status').textContent='PUNTO '+p;}}function stopAll(){document.getElementById('audioPlayer').pause();document.getElementById('status').textContent='DETENIDO';}function iniciarAuto(){if(cerPuntosActivosManualIAA.length>0){let i=0;const s=()=>{if(i>=cerPuntosActivosManualIAA.length){document.getElementById('status').textContent='✅ COMPLETADA';return;}reproducirPunto(cerPuntosActivosManualIAA[i]);i++;setTimeout(s,3000);};s();}}calcularPuntos();</script></body></html>
