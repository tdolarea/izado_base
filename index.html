<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Izado y Arriado en Tierra</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#070d1e;color:#f1f5f9;min-height:100vh}header{background:#0f172a;border-bottom:2px solid #1e3a8a;padding:12px;text-align:center;font-weight:800;color:#38bdf8}main{padding:14px;max-width:800px;margin:0 auto}.card{background:#0f172a;border:1px solid #1e3a8a;border-radius:10px;padding:14px;margin-bottom:14px}.card-title{font-size:13px;font-weight:800;color:#38bdf8;margin-bottom:10px}button{background:#1e293b;border:1.5px solid #334155;color:#f8fafc;padding:12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;min-height:48px;transition:0.15s;width:100%;margin-bottom:8px}button:active{background:#0284c7;border-color:#38bdf8}button.primary{background:#0c4a6e;border-color:#0284c7}.status-bar{background:#7f1d1d;border:2px solid #ef4444;border-radius:8px;padding:12px;color:#fef2f2;margin-bottom:14px;display:flex;justify-content:space-between}.status-stop{background:#dc2626;padding:8px 16px;border-radius:6px;color:white;font-weight:900;border:none}</style></head><body><header>Izado y Arriado en Tierra</header><main><div class="card"><div class="card-title">⚙️ Evento</div><button class="primary" id="btnIzado" onclick="setModo('izado')">📌 Izado</button><button id="btnArriado" onclick="setModo('arriado')">📖 Arriado</button><button id="btnGuardia" onclick="setGuardia(!conGuardia)">💂 Guardia: SÍ</button></div><div class="card"><div class="card-title">🎵 Opciones</div><button onclick="setAcompañamiento('himno')">🎵 Himno</button><button onclick="setAcompañamiento('corneta')">📯 Corneta</button><button onclick="setAcompañamiento('chifle')">🎺 Chifle</button><button onclick="setAcompañamiento('himno_chifle')">🎵+🎺 Himno+Chifle</button><div id="seccionOracion" style="display:none;margin-top:12px;padding:12px;background:#0b152d;border-radius:8px"><div style="font-size:11px;font-weight:800;color:#fcd34d;margin-bottom:8px">✝️ Oración:</div><button onclick="setOracion('corneta')">📯 Corneta de Oración</button><button onclick="setOracion('musica')">🎵 Oración Cantada</button><button onclick="setOracion('leida')">📖 Oración Leída</button><button onclick="setOracion('ninguna')">⊘ Ninguna Oración</button></div></div><div class="card"><div class="card-title">⏸️ Secuencia Manual</div><div class="status-bar"><span id="status">Listo</span><button class="status-stop" onclick="stopAll()">⏹️ STOP</button></div><div id="puntosGrid"></div></div><div class="card"><button class="primary" style="padding:16px;font-size:14px;background:#0284c7" onclick="iniciarAuto()">▶️ INICIAR SECUENCIA CONTINUA</button></div></main><audio id="audioPlayer"></audio><script>let modo='izado',conGuardia=true,acompañamiento='himno',oracion='corneta';let cerPuntosActivosManualIAA=[];const audioURLs={'1_izado':'audios/01_01_senales_izado.mp3','1_arriado':'audios/01_02_senales_arriado.mp3','2':'audios/02_firmes.mp3','3_voz':'audios/03_01_presenten_voz.mp3','3_corneta':'audios/03_02_presenten_corneta.wav','4':'audios/04_ejecutiva.wav','5_himno':'audios/05_01_himno.mp3','5_chifle':'audios/05_02_chifle.mp3','5_corneta':'audios/05_03_corneta.wav','5_himno_chifle':'audios/05_04_himno_chifle.mp3','6':'audios/06_descansen.wav','7':'audios/07_envainen.wav','8_corneta':'audio/event08_01_CornetaToquedeOracion.wav','8_musica':'audio/event08_02_Oracion_CANTADA.mp3','8_leida':'audio/event08_03_VOZORACION.mp3'};const nombresPuntos={1:'📻 Señales a la Bandera',2:'🫡 Presenten',3:'🎙️ Orden Presenten',4:'🎵 Acompañamiento',5:'🎼 Himno Nacional',6:'🫡 Descansen',7:'🗡️ Envainen',8:'✝️ Oración'};function setModo(m){modo=m;calcularPuntos();document.getElementById('btnIzado').className=m==='izado'?'primary':'';document.getElementById('btnArriado').className=m==='arriado'?'primary':'';}function setGuardia(g){conGuardia=g;calcularPuntos();document.getElementById('btnGuardia').textContent='💂 Guardia: '+(g?'SÍ':'NO');}function setAcompañamiento(a){acompañamiento=a;calcularPuntos();}function setOracion(o){oracion=o;}function calcularPuntos(){const tieneHimno=(acompañamiento==='himno'||acompañamiento==='himno_chifle');cerPuntosActivosManualIAA=[];if(modo==='izado'){if(conGuardia){cerPuntosActivosManualIAA=[1,2,3,5,6,7];if(tieneHimno)cerPuntosActivosManualIAA.splice(3,0,4);}else{cerPuntosActivosManualIAA=[1,5];if(tieneHimno)cerPuntosActivosManualIAA.splice(1,0,4);}document.getElementById('seccionOracion').style.display='none';}else{if(conGuardia){cerPuntosActivosManualIAA=[1,2,3,5,6,7,8];if(tieneHimno)cerPuntosActivosManualIAA.splice(3,0,4);}else{cerPuntosActivosManualIAA=[1,5,8];if(tieneHimno)cerPuntosActivosManualIAA.splice(1,0,4);}document.getElementById('seccionOracion').style.display='block';}renderPuntos();}function renderPuntos(){const grid=document.getElementById('puntosGrid');grid.innerHTML='';for(let p of cerPuntosActivosManualIAA){const btn=document.createElement('button');btn.textContent=nombresPuntos[p]||('Punto '+p);btn.onclick=()=>reproducirPunto(p);grid.appendChild(btn);}}function getAudioURL(p){if(p===1)return modo==='izado'?audioURLs['1_izado']:audioURLs['1_arriado'];if(p===3)return audioURLs['3_voz'];if(p===5)return audioURLs['5_'+acompañamiento]||audioURLs['5_himno'];if(p===8){if(oracion==='ninguna')return '';if(oracion==='corneta')return audioURLs['8_corneta'];if(oracion==='musica')return audioURLs['8_musica'];if(oracion==='leida')return audioURLs['8_leida'];return '';}return audioURLs[p]||'';}function reproducirPunto(p){const url=getAudioURL(p);if(url){const audio=document.getElementById('audioPlayer');audio.src=url;audio.play();document.getElementById('status').textContent=nombresPuntos[p]||('Punto '+p);}}function stopAll(){document.getElementById('audioPlayer').pause();document.getElementById('status').textContent='Detenido';}function iniciarAuto(){if(cerPuntosActivosManualIAA.length>0){let idx=0;const siguiente=()=>{if(idx>=cerPuntosActivosManualIAA.length){document.getElementById('status').textContent='✅ Secuencia completada';return;}reproducirPunto(cerPuntosActivosManualIAA[idx]);idx++;setTimeout(siguiente,3000);};siguiente();}}calcularPuntos();</script></body></html>
