<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Izado y Arriado en Tierra</title><style>* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }body { background: #070d1e; color: #f1f5f9; min-height: 100vh; }header { background: #0f172a; border-bottom: 2px solid #1e3a8a; padding: 12px; text-align: center; font-weight: 800; color: #38bdf8; }main { padding: 14px; max-width: 800px; margin: 0 auto; width: 100%; }.card { background: #0f172a; border: 1px solid #1e3a8a; border-radius: 10px; padding: 14px; margin-bottom: 14px; }.card-title { font-size: 13px; font-weight: 800; color: #38bdf8; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 6px; }.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }.btn-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; margin-bottom: 12px; }.btn-col { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }button { background: #1e293b; border: 1.5px solid #334155; color: #f8fafc; padding: 12px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; min-height: 48px; transition: 0.15s; }button:active { background: #0284c7; border-color: #38bdf8; }button.primary { background: #0c4a6e; border-color: #0284c7; }.status-bar { background: #7f1d1d; border: 2px solid #ef4444; border-radius: 8px; padding: 12px; color: #fef2f2; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }.status-stop { background: #dc2626; border: 1.5px solid #fecaca; color: white; padding: 8px 16px; border-radius: 6px; font-weight: 900; font-size: 13px; cursor: pointer; }#puntosGrid { display: grid; grid-template-columns: 1fr; gap: 8px; }#puntosGrid button { width: 100%; text-align: left; }#seccionOracion { display: none; margin-top: 12px; padding: 12px; background: #0b152d; border-radius: 8px; border-left: 3px solid #f59e0b; }</style></head><body><header>Izado y Arriado en Tierra</header><main><div class="card"><div class="card-title">⚙️ EVENTO</div><div class="btn-row"><button class="primary" id="btnIzado" onclick="setModo('izado')">📌 IZADO</button><button id="btnArriado" onclick="setModo('arriado')">📖 ARRIADO</button></div><button id="btnGuardia" style="width:100%" onclick="setGuardia(!conGuardia)">💂 GUARDIA: SÍ</button></div><div class="card"><div class="card-title">🎵 OPCIONES</div><div class="btn-row-4"><button onclick="setAcompañamiento('himno')">🎵 HIMNO</button><button onclick="setAcompañamiento('corneta')">📯 CORNETA</button><button onclick="setAcompañamiento('chifle')">🎺 CHIFLE</button><button onclick="setAcompañamiento('himno_chifle')">H+C</button></div><div id="seccionOracion"><div style="font-size:11px; font-weight:800; color:#fcd34d; margin-bottom:8px">✝️ ORACIÓN:</div><div class="btn-row-4"><button onclick="setOracion('corneta')">📯 CORNETA</button><button onclick="setOracion('musica')">🎵 CANTADA</button><button onclick="setOracion('leida')">📖 LEÍDA</button><button onclick="setOracion('ninguna')">⊘ NINGUNA</button></div></div></div><div class="card"><div class="card-title">⏸️ SECUENCIA MANUAL</div><div class="status-bar"><span id="status">LISTO</span><button class="status-stop" onclick="stopAll()">⏹️ STOP</button></div><div id="puntosGrid"></div></div><div class="card"><button class="primary" style="width:100%; padding:16px; font-size:14px; background:#0284c7; border-color:#38bdf8" onclick="iniciarAuto()">▶️ INICIAR SECUENCIA CONTINUA</button></div></main><audio id="audioPlayer"></audio><script>let modo='izado', conGuardia=true, acompañamiento='himno', oracion='corneta';let cerPuntosActivosManualIAA=[];const audioURLs={'1_izado':'audios/01_01_senales_izado.mp3','1_arriado':'audios/01_02_senales_arriado.mp3','2':'audios/02_firmes.mp3','3_voz':'audios/03_01_presenten_voz.mp3','3_corneta':'audios/03_02_presenten_corneta.wav','4':'audios/04_ejecutiva.wav','5_himno':'audios/05_01_himno.mp3','5_chifle':'audios/05_02_chifle.mp3','5_corneta':'audios/05_03_corneta.wav','5_himno_chifle':'audios/05_04_himno_chifle.mp3','6':'audios/06_descansen.wav','7':'audios/07_envainen.wav','8_corneta':'audio/event08_01_CornetaToquedeOracion.wav','8_musica':'audio/event08_02_Oracion_CANTADA.mp3','8_leida':'audio/event08_03_VOZORACION.mp3'};const nombresPuntos={1:'📻 SEÑALES',2:'🫡 PRESENTEN',3:'🎙️ ORDEN PRESENTEN',4:'🎵 ACOMPAÑAMIENTO',5:'🎼 HIMNO NACIONAL',6:'🫡 DESCANSEN',7:'🗡️ ENVAINEN',8:'✝️ ORACIÓN'};function setModo(m){modo=m;calcularPuntos();document.getElementById('btnIzado').className = m==='izado' ? 'primary' : '';document.getElementById('btnArriado').className = m==='arriado' ? 'primary' : '';}function setGuardia(g){conGuardia = g;calcularPuntos();document.getElementById('btnGuardia').textContent = '💂 GUARDIA: ' + (g ? 'SÍ' : 'NO');}function setAcompañamiento(a){acompañamiento = a;calcularPuntos();}function setOracion(o){oracion = o;}function calcularPuntos(){const tieneHimno = (acompañamiento==='himno' || acompañamiento==='himno_chifle');cerPuntosActivosManualIAA = [];if(modo==='izado'){if(conGuardia){cerPuntosActivosManualIAA = [1,2,3,5,6,7];if(tieneHimno) cerPuntosActivosManualIAA.splice(3,0,4);}else{cerPuntosActivosManualIAA = [1,5];if(tieneHimno) cerPuntosActivosManualIAA.splice(1,0,4);}document.getElementById('seccionOracion').style.display = 'none';}else{if(conGuardia){cerPuntosActivosManualIAA = [1,2,3,5,6,7,8];if(tieneHimno) cerPuntosActivosManualIAA.splice(3,0,4);}else{cerPuntosActivosManualIAA = [1,5,8];if(tieneHimno) cerPuntosActivosManualIAA.splice(1,0,4);}document.getElementById('seccionOracion').style.display = 'block';}renderPuntos();}function renderPuntos(){const grid = document.getElementById('puntosGrid');grid.innerHTML = '';for(let p of cerPuntosActivosManualIAA){const btn = document.createElement('button');btn.textContent = 'PUNTO '+p+': '+nombresPuntos[p];btn.onclick = () => reproducirPunto(p);grid.appendChild(btn);}}function getAudioURL(p){if(p===1) return modo==='izado' ? audioURLs['1_izado'] : audioURLs['1_arriado'];if(p===3) return audioURLs['3_voz'];if(p===5) return audioURLs['5_'+acompañamiento] || audioURLs['5_himno'];if(p===8){if(oracion==='ninguna') return '';if(oracion==='corneta') return audioURLs['8_corneta'];if(oracion==='musica') return audioURLs['8_musica'];if(oracion==='leida') return audioURLs['8_leida'];return '';}return audioURLs[p] || '';}function reproducirPunto(p){const url = getAudioURL(p);if(url){const audio = document.getElementById('audioPlayer');audio.src = url;audio.play();document.getElementById('status').textContent = 'PUNTO '+p;}else{document.getElementById('status').textContent = 'PUNTO '+p+': SIN AUDIO';}}function stopAll(){document.getElementById('audioPlayer').pause();document.getElementById('status').textContent = 'DETENIDO';}function iniciarAuto(){if(cerPuntosActivosManualIAA.length > 0){let idx = 0;const siguiente = () => {if(idx >= cerPuntosActivosManualIAA.length){document.getElementById('status').textContent = '✅ SECUENCIA COMPLETADA';return;}reproducirPunto(cerPuntosActivosManualIAA[idx]);idx++;setTimeout(siguiente, 3000);};siguiente();}}calcularPuntos();</script></body></html>
