<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070d1e">
  <title>Izado y Arriado en Acuartelamientos (IAA)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #070d1e; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    header { background: #0f172a; border-bottom: 2px solid #1e3a8a; padding: 14px; text-align: center; }
    header h1 { font-size: 18px; color: #38bdf8; }
    header p { font-size: 12px; color: #94a3b8; }
    main { max-width: 800px; margin: 0 auto; padding: 14px; }
    .card { background: #0f172a; border: 1px solid #1e3a8a; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .card-title { font-size: 13px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 10px; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .btn { background: #0c4a6e; border: 1.5px solid #0284c7; color: #e0f2fe; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; }
    .btn:active { background: #0284c7; transform: scale(0.98); }
    .btn.danger { background: #450a0a; border-color: #ef4444; color: #fca5a5; }
    .btn.danger:active { background: #dc2626; }
    .status { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 12px; color: #cbd5e1; text-align: center; min-height: 40px; }
    .puntos-grid { display: grid; grid-template-columns: 1fr; gap: 8px; max-width: 520px; margin: 0 auto; padding: 0 16px; }
    .punto-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 16px 18px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left; min-height: 56px; display: flex; align-items: center; text-transform: uppercase; letter-spacing: 0.5px; }
    .punto-btn:active { background: #0284c7; border-color: #38bdf8; }
    .punto-btn.disabled { opacity: 0.3; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1>🇪🇸 Izado y Arriado en Acuartelamientos</h1>
    <p>PWA - Protocolo en Tierra</p>
  </header>

  <main>
    <!-- SELECTOR MODALIDAD Y GUARDIA -->
    <div class="card">
      <div class="card-title">⚙️ Configuración</div>
      
      <!-- Izado / Arriado - Botones permanentes resaltados -->
      <div class="btn-group">
        <button id="btnIzado" class="btn" style="background:#0c4a6e;" onclick="setModo('izado')">📌 Izado</button>
        <button id="btnArriado" class="btn" onclick="setModo('arriado')">📖 Arriado</button>
      </div>

      <!-- Guardia Militar - Toggle Si/No -->
      <div style="margin-top:12px; padding:10px; background:#1e293b; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; font-weight:700; color:#cbd5e1;">💂 Guardia Militar:</span>
        <div style="display:flex; gap:6px;">
          <button id="btnGuardiaSi" class="btn" style="flex:1; background:#0c4a6e; padding:8px;" onclick="setGuardia(true)">Sí</button>
          <button id="btnGuardiaNo" class="btn" style="flex:1; background:#334155; padding:8px;" onclick="setGuardia(false)">No</button>
        </div>
      </div>
    </div>

    <!-- OPCIONES ESPECÍFICAS POR SECCIÓN -->
    <div class="card">
      <div class="card-title">🎵 Opciones del Protocolo</div>

      <!-- SECCIÓN 1: Orden de Presenten (Solo si hay Guardia) -->
      <div id="seccionPresenten" style="display:none; margin-bottom:14px; padding:10px; background:#1e293b; border-radius:8px; border-left:3px solid #0284c7;">
        <div style="font-size:11px; font-weight:700; color:#38bdf8; margin-bottom:8px;">🎙️ Orden de Presenten Armas:</div>
        <div class="btn-group">
          <button id="btnPresentenVoz" class="btn" style="background:#0c4a6e;" onclick="setPresenten('voz')">🗣️ A la Voz</button>
          <button id="btnPresentenCorneta" class="btn" onclick="setPresenten('corneta')">📯 A Corneta</button>
        </div>
      </div>

      <!-- SECCIÓN 2: Tipo de Música/Acompañamiento -->
      <div style="margin-bottom:14px; padding:10px; background:#1e293b; border-radius:8px; border-left:3px solid #10b981;">
        <div style="font-size:11px; font-weight:700; color:#6ee7b7; margin-bottom:8px;">🎵 Acompañamiento de la Bandera:</div>
        <div class="btn-group">
          <button id="btnAcompHimno" class="btn" style="background:#0c4a6e;" onclick="setAcompañamiento('himno')">🎺 Himno</button>
          <button id="btnAcompChifle" class="btn" onclick="setAcompañamiento('chifle')">🚪 Chifle</button>
        </div>
        <div class="btn-group" style="margin-top:6px;">
          <button id="btnAcompCorneta" class="btn" onclick="setAcompañamiento('corneta')">📯 Corneta</button>
          <button id="btnAcompHimnoChifle" class="btn" onclick="setAcompañamiento('himno_chifle')">🎺+🚪 Himno+Chifle</button>
        </div>
      </div>

      <!-- SECCIÓN 3: Tipo de Oración (Solo en Arriado) -->
      <div id="seccionOracion" style="display:none; padding:10px; background:#1e293b; border-radius:8px; border-left:3px solid #f59e0b;">
        <div style="font-size:11px; font-weight:700; color:#fcd34d; margin-bottom:8px;">✝️ Oración del Arriado:</div>
        <div class="btn-group">
          <button id="btnOracionCorneta" class="btn" style="background:#0c4a6e;" onclick="setOracion('corneta')">📯 Corneta</button>
          <button id="btnOracionMusica" class="btn" onclick="setOracion('musica')">🎼 Música</button>
        </div>
        <div class="btn-group" style="margin-top:6px;">
          <button id="btnOracionLeida" class="btn" onclick="setOracion('leida')">🗣️ Leída</button>
          <button id="btnOracionNinguna" class="btn" onclick="setOracion('ninguna')">❌ Ninguna</button>
        </div>
      </div>
    </div>

    <!-- MODO MANUAL -->
    <div class="card">
      <div class="card-title">⏸️ Modo Manual - Paso a Paso</div>
      <div class="status" id="status">Esperando inicio...</div>
      <div class="puntos-grid" id="puntosGrid">
        <!-- Dinámico -->
      </div>
      <div class="btn-group" style="margin-top:12px;">
        <button class="btn" onclick="resetManual()">🔄 Reiniciar</button>
        <button class="btn danger" onclick="stopAll()">⏹️ Detener</button>
      </div>
    </div>

    <!-- MODO AUTOMÁTICO -->
    <div class="card">
      <div class="btn-group">
        <button class="btn" onclick="iniciarAuto()" style="grid-column:1/3; padding:16px; font-size:14px;">▶️ INICIAR SECUENCIA CONTINUA</button>
      </div>
    </div>
  </main>

  <!-- AUDIOS -->
  <audio id="audioPlayer"></audio>
  <audio id="audioPlayer2"></audio>

  <script>
    let modo = 'izado';
    let conGuardia = true;
    let modalidadPresenten = 'corneta';
    let acompañamiento = 'himno';
    let oracion = 'corneta';
    let puntosActivos = [];
    
    // Variable para controlar qué opciones están seleccionadas
    let seleccionesActuales = {
      modo: 'izado',
      guardia: true,
      presenten: 'corneta',
      acompañamiento: 'himno',
      oracion: 'corneta'
    };

    const audioMap = {
      'event01_01': 'audio/VOZELENASENALES.mp3',
      'event01_02': 'audio/senalesalabandera.mp3',
      'event02': 'audio/cornetafirmes.wav',
      'event03_01': 'audio/voz_presenten_armas.mp3',
      'event03_02': 'audio/cornetapresentenarmas.wav',
      'event04': 'audio/cornetaordenhimnonacional.wav',
      'event05_01': 'audio/Espania_largo.mp3',
      'event05_02': 'audio/chiflecompletobanderalargo.mp3',
      'event05_03': 'audio/CornetaHimnonacionalacorneta-reducido.wav',
      'event06': 'audio/event06.wav',
      'event07': 'audio/event07.wav',
      'event08_01': 'audio/CornetaToquedeOracion.wav',
      'event08_02': 'audio/OraciondelaNoche.mp3',
      'event08_03': 'audio/VOZORACION.mp3',
      'event05_04': 'audio/event05_04.mp3',
    };

    const puntosLabel = {
      1: '1. 🗣️ Señales',
      2: '2. 📯 Firmes',
      3: '3. ⚔️ Presenten',
      4: '4. 📯 Ejecutiva',
      5: '5. 🎺 Acompañamiento',
      6: '6. 📯 Descansen',
      7: '7. 📯 Envainen',
      8: '8. ✝️ Oración',
    };


function updateUI() {
      // ===== GRUPO 1: Izado / Arriado =====
      const btnIzado = document.getElementById('btnIzado');
      const btnArriado = document.getElementById('btnArriado');
      if (btnIzado) {
        btnIzado.style.background = modo === 'izado' ? '#0c4a6e' : '#334155';
        btnIzado.style.boxShadow = modo === 'izado' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnIzado.textContent = modo === 'izado' ? '📌 Izado ●' : '📌 Izado';
      }
      if (btnArriado) {
        btnArriado.style.background = modo === 'arriado' ? '#0c4a6e' : '#334155';
        btnArriado.style.boxShadow = modo === 'arriado' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnArriado.textContent = modo === 'arriado' ? '📖 Arriado ●' : '📖 Arriado';
      }

      // ===== GRUPO 2: Guardia Si/No =====
      const btnGuardiaSi = document.getElementById('btnGuardiaSi');
      const btnGuardiaNo = document.getElementById('btnGuardiaNo');
      if (btnGuardiaSi) {
        btnGuardiaSi.style.background = conGuardia ? '#0c4a6e' : '#334155';
        btnGuardiaSi.style.boxShadow = conGuardia ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnGuardiaSi.textContent = conGuardia ? 'Sí ●' : 'Sí';
      }
      if (btnGuardiaNo) {
        btnGuardiaNo.style.background = !conGuardia ? '#0c4a6e' : '#334155';
        btnGuardiaNo.style.boxShadow = !conGuardia ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnGuardiaNo.textContent = !conGuardia ? 'No ●' : 'No';
      }

      // ===== GRUPO 3: Orden de Presenten (solo si hay Guardia y Punto 3 activo) =====
      const seccionPresenten = document.getElementById('seccionPresenten');
      if (seccionPresenten) {
        seccionPresenten.style.display = (conGuardia && cerPuntosActivosManualIAA.includes(3)) ? 'block' : 'none';
      }
      const btnPresentenVoz = document.getElementById('btnPresentenVoz');
      const btnPresentenCorneta = document.getElementById('btnPresentenCorneta');
      if (btnPresentenVoz) {
        btnPresentenVoz.style.background = modalidadPresenten === 'voz' ? '#0c4a6e' : '#334155';
        btnPresentenVoz.style.boxShadow = modalidadPresenten === 'voz' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnPresentenVoz.textContent = modalidadPresenten === 'voz' ? '🗣️ A la Voz ●' : '🗣️ A la Voz';
      }
      if (btnPresentenCorneta) {
        btnPresentenCorneta.style.background = modalidadPresenten === 'corneta' ? '#0c4a6e' : '#334155';
        btnPresentenCorneta.style.boxShadow = modalidadPresenten === 'corneta' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnPresentenCorneta.textContent = modalidadPresenten === 'corneta' ? '📯 A Corneta ●' : '📯 A Corneta';
      }

      // ===== GRUPO 4: Acompañamiento de la Bandera =====
      const btnAcompHimno = document.getElementById('btnAcompHimno');
      const btnAcompChifle = document.getElementById('btnAcompChifle');
      const btnAcompCorneta = document.getElementById('btnAcompCorneta');
      const btnAcompHimnoChifle = document.getElementById('btnAcompHimnoChifle');
      
      if (btnAcompHimno) {
        btnAcompHimno.style.background = acompañamiento === 'himno' ? '#0c4a6e' : '#334155';
        btnAcompHimno.style.boxShadow = acompañamiento === 'himno' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnAcompHimno.textContent = acompañamiento === 'himno' ? '🎺 Himno ●' : '🎺 Himno';
      }
      if (btnAcompChifle) {
        btnAcompChifle.style.background = acompañamiento === 'chifle' ? '#0c4a6e' : '#334155';
        btnAcompChifle.style.boxShadow = acompañamiento === 'chifle' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnAcompChifle.textContent = acompañamiento === 'chifle' ? '🚪 Chifle ●' : '🚪 Chifle';
      }
      if (btnAcompCorneta) {
        btnAcompCorneta.style.background = acompañamiento === 'corneta' ? '#0c4a6e' : '#334155';
        btnAcompCorneta.style.boxShadow = acompañamiento === 'corneta' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnAcompCorneta.textContent = acompañamiento === 'corneta' ? '📯 Corneta ●' : '📯 Corneta';
      }
      if (btnAcompHimnoChifle) {
        btnAcompHimnoChifle.style.background = acompañamiento === 'himno_chifle' ? '#0c4a6e' : '#334155';
        btnAcompHimnoChifle.style.boxShadow = acompañamiento === 'himno_chifle' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnAcompHimnoChifle.textContent = acompañamiento === 'himno_chifle' ? '🎺+🚪 Himno + Chifle ●' : '🎺+🚪 Himno + Chifle';
      }

      // ===== GRUPO 5: Oración (solo en ARRIADO) =====
      const seccionOracion = document.getElementById('seccionOracion');
      if (seccionOracion) {
        seccionOracion.style.display = cerPuntosActivosManualIAA.includes(8) ? 'block' : 'none';
      }
      const btnOracionCorneta = document.getElementById('btnOracionCorneta');
      const btnOracionMusica = document.getElementById('btnOracionMusica');
      const btnOracionLeida = document.getElementById('btnOracionLeida');
      const btnOracionNinguna = document.getElementById('btnOracionNinguna');
      
      if (btnOracionCorneta) {
        btnOracionCorneta.style.background = oracion === 'corneta' ? '#0c4a6e' : '#334155';
        btnOracionCorneta.style.boxShadow = oracion === 'corneta' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnOracionCorneta.textContent = oracion === 'corneta' ? '📯 Corneta ●' : '📯 Corneta';
      }
      if (btnOracionMusica) {
        btnOracionMusica.style.background = oracion === 'musica' ? '#0c4a6e' : '#334155';
        btnOracionMusica.style.boxShadow = oracion === 'musica' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnOracionMusica.textContent = oracion === 'musica' ? '🎼 Música ●' : '🎼 Música';
      }
      if (btnOracionLeida) {
        btnOracionLeida.style.background = oracion === 'leida' ? '#0c4a6e' : '#334155';
        btnOracionLeida.style.boxShadow = oracion === 'leida' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnOracionLeida.textContent = oracion === 'leida' ? '🗣️ Leída ●' : '🗣️ Leída';
      }
      if (btnOracionNinguna) {
        btnOracionNinguna.style.background = oracion === 'ninguna' ? '#0c4a6e' : '#334155';
        btnOracionNinguna.style.boxShadow = oracion === 'ninguna' ? '0 0 15px rgba(16, 185, 129, 0.8)' : 'none';
        btnOracionNinguna.textContent = oracion === 'ninguna' ? '❌ Ninguna ●' : '❌ Ninguna';
      }
    }

    
    function actualizarLabelPunto5() {
      let labelPunto5 = '5. 🎺 ';
      if (acompañamiento === 'himno') labelPunto5 += 'Himno';
      else if (acompañamiento === 'chifle') labelPunto5 += 'Chifle';
      else if (acompañamiento === 'corneta') labelPunto5 += 'Corneta';
      else if (acompañamiento === 'himno_chifle') labelPunto5 += 'Himno + Chifle';
      
      puntosLabel[5] = labelPunto5;
      renderPuntos(); // Re-renderizar botones con nuevo label
    }

    
    function actualizarVisibilidadPunto4() {
      // Botón 4 solo activo si hay Himno en el acompañamiento
      const tieneHimno = (acompañamiento === 'himno' || acompañamiento === 'himno_chifle');
      
      // Como los botones se renderizan dinámicamente en renderPuntos(),
      // necesitamos controlar si Punto 4 está en la lista de puntos activos
      
      if (tieneHimno) {
        // Asegurarse de que Punto 4 esté en cerPuntosActivosManualIAA si no está ya
        if (!cerPuntosActivosManualIAA.includes(4)) {
          cerPuntosActivosManualIAA.push(4);
          cerPuntosActivosManualIAA.sort((a, b) => a - b); // Mantener orden
        }
      } else {
        // Remover Punto 4 de cerPuntosActivosManualIAA
        const idx = cerPuntosActivosManualIAA.indexOf(4);
        if (idx > -1) {
          cerPuntosActivosManualIAA.splice(idx, 1);
        }
      }
      
      // Renderizar de nuevo los puntos
      renderPuntos();
    }

    
    function calcularPuntos() {
      cerPuntosActivosManualIAA = [];
      const tieneHimno = (acompañamiento === 'himno' || acompañamiento === 'himno_chifle');
      
      // Definir puntos según modalidad
      if (modo === 'izado') {
        if (conGuardia) {
          // IZADO con guardia: 1,2,3,4,5,6,7
          cerPuntosActivosManualIAA = [1, 2, 3, 5, 6, 7]; // SIN Punto 4 inicialmente
          if (tieneHimno) cerPuntosActivosManualIAA.splice(3, 0, 4); // Insertar Punto 4 solo si hay Himno
        } else {
          // IZADO sin guardia: 1,4,5 (pero 4 solo si hay himno)
          cerPuntosActivosManualIAA = [1, 5];
          if (tieneHimno) cerPuntosActivosManualIAA.splice(1, 0, 4);
        }
      } else {
        // ARRIADO
        if (conGuardia) {
          // ARRIADO con guardia: 1,2,3,4,5,6,7,8
          cerPuntosActivosManualIAA = [1, 2, 3, 5, 6, 7, 8]; // SIN Punto 4 inicialmente
          if (tieneHimno) cerPuntosActivosManualIAA.splice(3, 0, 4); // Insertar Punto 4 en posición correcta
        } else {
          // ARRIADO sin guardia: 1,4,5,8 (pero 4 solo si hay himno)
          cerPuntosActivosManualIAA = [1, 5, 8];
          if (tieneHimno) cerPuntosActivosManualIAA.splice(1, 0, 4);
        }
      }
      
      renderPuntos();
      updateUI();
    }

function obtenerLabelPunto(p) {
      const labels = {
        1: '1. 🗣️ SEÑALES',
        2: '2. 📯 FIRMES',
        3: modalidadPresenten === 'voz' ? '3. 🗣️ PRESENTEN VOZ' : '3. 📯 PRESENTEN CORNETA',
        4: '4. 📯 EJECUTIVA',
        5: acompañamiento === 'himno' ? '5. 🎺 HIMNO' : acompañamiento === 'chifle' ? '5. 🚪 CHIFLE' : acompañamiento === 'corneta' ? '5. 📯 CORNETA' : '5. 🎺+🚪 HIMNO+CHIFLE',
        6: '6. 📯 DESCANSEN',
        7: '7. 📯 ENVAINEN',
        8: oracion === 'corneta' ? '8. 📯 ORACIÓN' : oracion === 'musica' ? '8. 🎼 ORACIÓN' : oracion === 'leida' ? '8. 🗣️ ORACIÓN' : '8. ORACIÓN'
      };
      return labels[p] || `Punto ${p}`;
    }

    function renderPuntos() {
      const grid = document.getElementById('puntosGrid');
      if (!grid) {
        console.error('Grid not found');
        return;
      }
      grid.innerHTML = '';
      
      // Usar cerPuntosActivosManualIAA (variable global con puntos activos)
      for (let p of cerPuntosActivosManualIAA) {
        const btn = document.createElement('button');
        btn.className = 'punto-btn';
        btn.style.width = '100%';
        btn.textContent = obtenerLabelPunto(p);
        btn.onclick = () => reproducirPunto(p);
        grid.appendChild(btn);
      }
      
      console.log('Puntos renderizados:', cerPuntosActivosManualIAA);
    }

    
    function reproducirDualAudio(audio1Url, audio2Url) {
      document.getElementById('status').textContent = '5. 🎺 HIMNO + CHIFLE (reproduciendo en paralelo...)';
      
      const player1 = document.getElementById('audioPlayer');
      const player2 = document.getElementById('audioPlayer2');
      
      player1.src = audio1Url;
      player2.src = audio2Url;
      
      let completados = 0;
      const finalizarDual = function() {
        completados++;
        if (completados >= 2) {
          document.getElementById('status').textContent = '5. 🎺 HIMNO + CHIFLE ✅';
        }
      };
      
      player1.onended = finalizarDual;
      player2.onended = finalizarDual;
      
      player1.onerror = function(err) {
        console.error('Player1 error:', err);
        finalizarDual();
      };
      
      player2.onerror = function(err) {
        console.error('Player2 error:', err);
        finalizarDual();
      };
      
      // Reproducir ambos simultáneamente
      Promise.all([player1.play(), player2.play()]).then(() => {
        console.log('Ambos audios reproduciendo');
      }).catch(err => {
        console.warn('Play bloqueado, intentando solo player1:', err);
        player1.play().catch(e => console.error('Player1 error:', e));
        player2.play().catch(e => console.error('Player2 error:', e));
      });
    }

    
    function reproducirPunto(p) {
      // Pausar cualquier audio en reproducción
      document.getElementById('audioPlayer').pause();
      document.getElementById('audioPlayer2').pause();
      
      let audio = null;
      let label = puntosLabel[p];
      
      if (p === 1) audio = audioMap[modo === 'izado' ? 'event01_01' : 'event01_02'];
      else if (p === 2) audio = audioMap['event02'];
      else if (p === 3) audio = audioMap[modalidadPresenten === 'voz' ? 'event03_01' : 'event03_02'];
      else if (p === 4) audio = audioMap['event04'];
      else if (p === 5) {
        if (acompañamiento === 'himno') audio = audioMap['event05_01'];
        else if (acompañamiento === 'chifle') audio = audioMap['event05_02'];
        else if (acompañamiento === 'corneta') audio = audioMap['event05_03'];
        else if (acompañamiento === 'himno_chifle') audio = audioMap['event05_04']; // Himno + Chifle mezclados
      }
      else if (p === 6) audio = audioMap['event06'];
      else if (p === 7) audio = audioMap['event07'];
      else if (p === 8) {
        if (oracion === 'corneta') audio = audioMap['event08_01'];
        else if (oracion === 'musica') audio = audioMap['event08_02'];
        else if (oracion === 'leida') audio = audioMap['event08_03'];
      }

      if (audio) {
        document.getElementById('status').textContent = label + ' (reproduciendo...)';
        const player = document.getElementById('audioPlayer');
        player.src = audio;
        player.play();
      }
    }

    function iniciarAuto() {
      if (puntosActivos.length === 0) {
        document.getElementById('status').textContent = '❌ No hay puntos activos';
        return;
      }

      // Punto 1 (Señales a la Bandera) se ejecuta a T-5 (separado)
      let puntosSecuencia = puntosActivos.filter(p => p !== 1);
      
      if (puntosActivos.includes(1)) {
        document.getElementById('status').textContent = '⏳ Ejecutando Punto 1 (T-5): Señales a la Bandera...';
        reproducirPunto(1);
        // Esperar a que termine Punto 1 + pausa de 2 segundos
        setTimeout(() => {
          iniciarSecuenciaContinua(puntosSecuencia);
        }, 8000); // Aproximadamente 5-6 segundos de audio + 2 segundos de pausa
      } else {
        iniciarSecuenciaContinua(puntosSecuencia);
      }
    }

    function iniciarSecuenciaContinua(puntos) {
      if (puntos.length === 0) {
        document.getElementById('status').textContent = '✅ Secuencia completada';
        return;
      }

      let idx = 0;
      
      function reproducirSiguiente() {
        if (idx >= puntos.length) {
          document.getElementById('status').textContent = '✅ Secuencia continua completada';
          return;
        }

        const puntoCurrent = puntos[idx];
        reproducirPunto(puntoCurrent);
        idx++;

        // Obtener duración aproximada del audio para esperar correctamente
        let duracion = obtenerDuracionAproximada(puntoCurrent);
        
        // Siguiente punto: duración audio + pausa de 1.5 segundos
        setTimeout(reproducirSiguiente, duracion + 1500);
      }

      reproducirSiguiente();
    }

    function obtenerDuracionAproximada(punto) {
      // Duraciones aproximadas de cada punto en ms
      const duraciones = {
        1: 5000,  // Señales
        2: 3000,  // Firmes
        3: 4000,  // Presenten
        4: 3500,  // Ejecutiva
        5: acompañamiento === 'himno_chifle' ? 85000 : (acompañamiento === 'himno' ? 60000 : 25000), // Ajustar por acompañamiento
        6: 3000,  // Descansen
        7: 3000,  // Envainen
        8: 60000, // Oración
      };
      return duraciones[punto] || 4000;
    }

    function setModo(m) { modo = m; calcularPuntos(); updateUI(); }
    function setGuardia(g) { conGuardia = g; calcularPuntos(); updateUI(); }
    function setPresenten(p) { modalidadPresenten = p; updateUI(); }
    function setAcompañamiento(a) { acompañamiento = a; actualizarLabelPunto5(); actualizarVisibilidadPunto4(); updateUI(); }
    function setOracion(o) { oracion = o; updateUI(); }
    function resetManual() { document.getElementById('status').textContent = 'Reiniciado'; }
    function stopAll() { document.getElementById('audioPlayer').pause(); document.getElementById('status').textContent = 'Detenido'; }

    // Inicializar
    calcularPuntos();
    actualizarLabelPunto5();
    actualizarVisibilidadPunto4();
    updateUI();
  </script>
</body>
</html>
