<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070d1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Izado y Arriado en Tierra</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #070d1e;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #0f172a;
      border-bottom: 2px solid #1e3a8a;
      padding: 12px 16px;
      display: flex;
      justify-content: center;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
    }
    main {
      flex: 1;
      padding: 14px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e3a8a;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 6px;
    }
    .reloj-grande {
      background: #1a2332;
      border: 2px solid #0284c7;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
      font-family: 'Courier New', monospace;
      margin-bottom: 12px;
    }
    .reloj-info {
      font-size: 12px;
      color: #38bdf8;
      text-align: center;
      font-weight: 700;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .action-btn {
      background: #1e293b;
      border: 1.5px solid #334155;
      color: #f8fafc;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
    }
    .action-btn:active {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .action-btn.primary {
      background: #0c4a6e;
      border-color: #0284c7;
      color: #e0f2fe;
    }
    .barra {
      padding: 6px 10px;
      background: #0b152d;
      border-radius: 8px;
      border-left: 3px solid #0284c7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .barra-label {
      font-size: 10.5px;
      font-weight: 800;
      color: #cbd5e1;
      white-space: nowrap;
    }
    .barra-botones {
      display: flex;
      gap: 4px;
    }
    .barra-btn {
      background: #1e293b;
      border: 1.5px solid #334155;
      color: #f8fafc;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: 0.15s;
    }
    .barra-btn:active {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      background: #22c55e;
      border-radius: 50%;
      opacity: 0;
      transition: 0.2s;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-group input,
    .input-group select {
      flex: 1;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #cbd5e1;
      font-weight: 700;
    }
    .input-group button {
      padding: 10px 16px;
      background: #0284c7;
      border: 1px solid #0284c7;
      border-radius: 6px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .status-bar {
      background: #7f1d1d;
      border: 2px solid #ef4444;
      border-radius: 8px;
      padding: 12px 16px;
      color: #fef2f2;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-stop {
      background: #dc2626;
      border: 1.5px solid #fecaca;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
    .puntos-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .punto-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 52px;
      display: flex;
      align-items: center;
    }
    .punto-btn:active {
      background: #0284c7;
    }
  </style>
</head>
