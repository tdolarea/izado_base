 <!-- PROGRAMACIÓN HORARIA -->      <div class="card" id="cardProgramacion" >      <div class="card-title">⏰ Programación Horaria</div>      <!-- RELOJ DENTRO DE PROGRAMACIÓN -->      <div style="background: #1a2332; border: 2px solid #0284c7; border-radius: 8px; padding: 12px; text-align: center; margin-bottom: 12px;">        <div style="font-size: 16px; font-weight: 800; color: #38bdf8; font-family: 'Courier New', monospace; margin-bottom: 6px;" id="reloj">--:--:--</div>        <div style="font-size: 11px; color: #38bdf8; font-weight: 700;"><span id="husoInfo">UTC</span> | <span id="fechaInfo">--/--/----</span></div>      </div>      <div id="secHoraIzado" style="display: none; margin-bottom: 12px; padding: 10px; background: #0b152d; border-radius: 8px; border-left: 3px solid #10b981;">        <div style="font-size: 11px; font-weight: 800; color: #cbd5e1; margin-bottom: 8px;">📌 HORA IZADO:</div>        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 10px; padding: 10px; background: #070d1e; border-radius: 6px;">          <div style="flex: 1;">            <div style="font-size: 10px; color: #94a3b8; margin-bottom: 4px;">Hora actual:</div>            <div style="font-size: 16px; font-weight: 800; color: #38bdf8; font-family: 'Courier New', monospace; cursor: pointer; padding: 6px 10px; border-radius: 4px; transition: 0.2s; user-select: none;" id="horaActualIzado" onclick="abrirModalHora()" onmouseover="this.style.background='#1e3a8a'" onmouseout="this.style.background='transparent'">--:--</div>          </div>          <div style="width: 2px; height: 40px; background: #334155;"></div>          <div style="flex: 0 0 auto; text-align: center;">            <div style="font-size: 10px; color: #94a3b8; margin-bottom: 4px;">Huso</div>            <div style="font-size: 18px; font-weight: 800; color: #fbbf24; font-family: 'Courier New', monospace;" id="husoNATOIzado">Z</div>          </div>        </div>        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">Programar Izado para:</div>        <div class="input-group">          <input type="time" id="horaIzado" value="08:00" onchange="actualizarHoraIzado()">        </div>      </div>      <div id="secHoraArriado" style="display: none; padding: 10px; background: #0b152d; border-radius: 8px; border-left: 3px solid #f59e0b;">        <div style="font-size: 11px; font-weight: 800; color: #fcd34d; margin-bottom: 8px;">🌅 HORA ARRIADO:</div>        <div style="display: flex; gap: 6px; margin-bottom: 10px;">          <button class="action-btn" id="btnArriadoManual" onclick="setArriado('manual')" style="padding: 8px 12px; font-size: 11px;"><span class="dot" id="dotArriadoManual"></span>Manual</button>          <button class="action-btn" id="btnArriadoOcaso" onclick="setArriado('ocaso')" style="padding: 8px 12px; font-size: 11px;"><span class="dot" id="dotArriadoOcaso"></span>Ocaso</button>        </div>        <div id="secArriadoManualInput" style="display: block; padding: 10px; background: #070d1e; border-radius: 6px;">          <div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">Hora Manual:</div>          <div class="input-group">            <input type="time" id="horaManualArriado" value="18:00">          </div>        </div>        <div id="secArriadoOcasoDisplay" style="display: none; padding: 10px; background: #070d1e; border-radius: 6px;">          <div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">Hora del Ocaso:</div>          <div style="font-size: 18px; color: #fcd34d; font-weight: 800; font-family: 'Courier New'; margin-bottom: 10px;" id="horaOcaso">--:--</div>          <button class="action-btn primary" style="width: 100%; margin-bottom: 10px;" onclick="calcularOcaso()">Calcular Ocaso</button>          <div id="secPosicionOcaso" style="display: none; padding: 10px; background: #1a2332; border-radius: 6px; border-left: 3px solid #0284c7;">            <div style="font-size: 11px; font-weight: 800; color: #94a3b8; margin-bottom: 8px;">📍         POSICIÓN:</div>            <div class="btn-grid" style="margin-bottom: 10px;">                     <button class="action-btn primary" onclick="setPosicion('base')">⚓ Base Naval</button>              <button class="action-btn" onclick="setPosicion('gps')">🛰️ GPS</button>              <button class="action-btn" onclick="setPosicion('manual')">✏️ Manual</button>            </div>            <div id="secBase" style="display: block; margin-bottom: 10px;">              <select id="selBase" style="width: 100%; padding: 10px; background: #070d1e; border: 1.5px solid #38bdf8; border-radius: 6px; color: #fff; font-size: 11px; font-weight: 800;" onchange="calcularOcasoBase()">                <option value="rota">Base Naval de Rota</option>                <option value="ferrol">Arsenal de Ferrol</option>                <option value="cartagena">Arsenal de Cartagena</option>                <option value="sanfernando">Base Naval San Fernando</option>                <option value="laspalmas">Arsenal Las Palmas</option>                <option value="marin">ENM de Marín</option>                <option value="mahon">Estación Naval Mahón</option>                <option value="ceuta">Comandancia Naval Ceuta</option>              </select>            </div>            <div id="secGPS" style="display: none; margin-bottom: 10px;">              <button class="action-btn primary" style="width: 100%;" onclick="obtenerGPS()">Obtener GPS</button>              <div style="font-size: 10px; color: #94a3b8; margin-top: 6px;" id="gpsStatus">Esperando GPS...</div>            </div>            <div id="secManual" style="display: none;">              <div class="input-group">                <input type="number" id="latInput" placeholder="Latitud" min="-90" max="90" step="0.001">                <input type="number" id="lonInput" placeholder="Longitud" min="-180" max="180" step="0.001">                <button onclick="guardarPosicion()">Guardar</button>              </div>            </div>          </div>        </div>      </div>    </div>
