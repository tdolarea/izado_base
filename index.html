<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Izado y Arriado en Tierra</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}body{background:#070d1e;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column}header{background:#0f172a;border-bottom:2px solid #1e3a8a;padding:12px;text-align:center;font-size:15px;font-weight:800;color:#38bdf8}main{flex:1;padding:14px;max-width:800px;margin:0 auto;width:100%}.card{background:#0f172a;border:1px solid #1e3a8a;border-radius:10px;padding:14px;margin-bottom:14px}.card-title{font-size:13px;font-weight:800;color:#38bdf8;text-transform:uppercase;margin-bottom:10px;border-bottom:1px solid #1e293b;padding-bottom:6px}.reloj{background:#1a2332;border:2px solid #0284c7;border-radius:8px;padding:12px;text-align:center;font-size:16px;font-weight:800;color:#38bdf8;font-family:monospace;margin-bottom:12px}.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}button{background:#1e293b;border:1.5px solid #334155;color:#f8fafc;padding:12px 14px;border-radius:8px;font-size:12.5px;font-weight:800;cursor:pointer;min-height:48px;transition:0.15s}button:active{background:#0284c7;border-color:#38bdf8}button.primary{background:#0c4a6e;border-color:#0284c7;color:#e0f2fe}.barra{padding:6px 10px;background:#0b152d;border-radius:8px;border-left:3px solid #0284c7;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.barra-label{font-size:10.5px;font-weight:800;color:#cbd5e1}.barra-botones{display:flex;gap:4px}.barra-btn{padding:6px 10px;border-radius:6px;font-size:11px;min-height:auto}.dot{display:inline-block;width:14px;height:14px;background:#22c55e;border-radius:50%;opacity:0.2;transition:0.2s;margin-right:4px}.puntos-grid{display:grid;grid-template-columns:1fr;gap:8px}.punto-btn{width:100%;text-align:left;padding:16px}.status-bar{background:#7f1d1d;border:2px solid #ef4444;border-radius:8px;padding:12px;color:#fef2f2;font-size:13px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}.status-stop{background:#dc2626;border:1.5px solid #fecaca;color:white;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:900}.input-group{display:flex;gap:8px;margin-bottom:12px}input,select{flex:1;padding:10px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#cbd5e1;font-weight:700}</style></head><body><header>Izado y Arriado en Tierra</header><main><div class="card"><div class="card-title">⚙️ Evento</div><div class="btn-grid" style="margin-bottom:10px"><button class="primary" id="btnIzado" onclick="setModo('izado')">📌 Izado</button><button id="btnArriado" onclick="setModo('arriado')">📖 Arriado</button></div><div class="barra"><div class="barra-label">💂 Guardia Militar:</div><div class="barra-botones"><button class="barra-btn" onclick="setGuardia(true)"><span class="dot" id="dotGuardiaSi"></span>Sí</button><button class="barra-btn" onclick="setGuardia(false)"><span class="dot" id="dotGuardiaNo"></span>No</button></div></div></div><div class="card" id="cardProgramacion" style="display:none"><div class="card-title">⏰ Programación Horaria</div><div class="reloj" id="reloj">--:--:-- Z</div><div id="secHoraIzado" style="display:none;margin-bottom:12px;padding:10px;background:#0b152d;border-radius:8px;border-left:3px solid #10b981"><div style="font-size:11px;font-weight:800;color:#cbd5e1;margin-bottom:8px">📌 HORA IZADO:</div><input type="time" id="horaIzado" value="08:00"></div><div id="secHoraArriado" style="display:none;padding:10px;background:#0b152d;border-radius:8px;border-left:3px solid #f59e0b"><div style="font-size:11px;font-weight:800;color:#fcd34d;margin-bottom:8px">🌅 HORA ARRIADO:</div><div style="display:flex;gap:6px;margin-bottom:10px"><button id="btnArriadoManual" onclick="setArriado('manual')" style="padding:8px 12px;font-size:11px;flex:1"><span class="dot" id="dotArriadoManual"></span>Manual</button><button id="btnArriadoOcaso" onclick="setArriado('ocaso')" style="padding:8px 12px;font-size:11px;flex:1"><span class="dot" id="dotArriadoOcaso"></span>Ocaso</button></div><div id="secArriadoManualInput" style="display:block;padding:10px;background:#070d1e;border-radius:6px"><div style="font-size:11px;color:#94a3b8;margin-bottom:6px">Hora Manual:</div><input type="time" id="horaManualArriado" value="18:00"></div></div></div><div class="card"><div class="card-title">🎵 Opciones</div><div class="barra" id="seccionPresenten" style="display:none"><div class="barra-label">🎙️ Orden Presenten:</div><div class="barra-botones"><button class="barra-btn" onclick="setPresenten('voz')"><span class="dot" id="dotPresentenVoz"></span>Voz</button><button class="barra-btn" onclick="setPresenten('corneta')"><span class="dot" id="dotPresentenCorneta"></span>Corneta</button></div></div><div style="padding:10px;background:#0b152d;border-radius:8px;border-left:3px solid #10b981;margin-bottom:12px"><div style="font-size:11px;font-weight:800;color:#38bdf8;margin-bottom:8px">🎵 Audio:</div><div class="btn-grid"><button onclick="setAcompañamiento('himno')" style="padding:8px 12px;font-size:11px"><span class="dot" id="dotAcompHimno"></span>Himno</button><button onclick="setAcompañamiento('corneta')" style="padding:8px 12px;font-size:11px"><span class="dot" id="dotAcompCorneta"></span>Corneta</button><button onclick="setAcompañamiento('chifle')" style="padding:8px 12px;font-size:11px"><span class="dot" id="dotAcompChifle"></span>Chifle</button><button onclick="setAcompañamiento('himno_chifle')" style="padding:8px 12px;font-size:11px"><span class="dot" id="dotAcompHimnoChifle"></span>H+C</button></div></div><div id="seccionOracion" style="display:none;padding:10px;background:#0b152d;border-radius:8px;border-left:3px solid #f59e0b"><div style="font-size:11px;font-weight:800;color:#fcd34d;margin-bottom:8px">✝️ Oración:</div><div class="btn-grid"><button onclick="setOracion('corneta')" style="padding:8px 12px;font-size:11px"><span class="dot" id="dotOracionCorneta"></span>Corneta</button><button onclick="setOracion('musica')" style="padding:8px 12px;font-size:11px"><span class="dot" id="dotOracionMusica"></span>Cantada</button><button onclick="setOracion('leida')" style="padding:8px 12px;font-size:11px"><span class="dot" id="dotOracionLeida"></span>Leída</button><button onclick="setOracion('ninguna')" style="padding:8px 12px;font-size:11px"><span class="dot" id="dotOracionNinguna"></span>Ninguna</button></div></div></div><div class="card"><div class="card-title">⚡ Ejecución</div><div class="btn-grid"><button class="primary" id="btnEjecAuto" onclick="setEjecucion('automatica')">🤖 Automática</button><button id="btnEjecManual" onclick="setEjecucion('manual')">👆 Manual</button></div><div id="secEjecAuto" style="display:none;padding:10px;background:#0b152d;border-radius:8px"><button class="primary" style="width:100%;background:#10b981;border-color:#34d399" onclick="iniciarAutomatica()">▶️ ACTIVAR EJECUCIÓN AUTOMÁTICA</button></div><div id="secEjecManual" style="display:none;padding:10px;background:#0b152d;border-radius:8px"><button class="primary" style="width:100%;background:#f59e0b;border-color:#fcd34d" onclick="reproducirManualT5()">🎙️ T-5 Señales</button></div></div><div class="card"><div class="card-title">⏸️ Modo Manual</div><div class="status-bar"><span id="status">Esperando inicio...</span><button class="status-stop" onclick="stopAll()">⏹️ STOP</button></div><div class="puntos-grid" id="puntosGrid"></div></div><div class="card"><button class="primary" style="width:100%;padding:16px;background:#0284c7;border-color:#38bdf8" onclick="iniciarAuto()">▶️ INICIAR SECUENCIA CONTINUA</button></div></main><audio id="audioPlayer"></audio><script>let modo='izado',conGuardia=true,modalidadPresenten='voz',acompañamiento='himno',oracion='corneta';let cerPuntosActivosManualIAA=[],arriado='manual',ejecucion='automatica';const audioURLs={'1_izado':'audios/01_01_senales_izado.mp3','1_arriado':'audios/01_02_senales_arriado.mp3','2':'audios/02_firmes.mp3','3_voz':'audios/03_01_presenten_voz.mp3','3_corneta':'audios/03_02_presenten_corneta.wav','4':'audios/04_ejecutiva.wav','5_himno':'audios/05_01_himno.mp3','5_chifle':'audios/05_02_chifle.mp3','5_corneta':'audios/05_03_corneta.wav','5_himno_chifle':'audios/05_04_himno_chifle.mp3','6':'audios/06_descansen.wav','7':'audios/07_envainen.wav','8_corneta':'audio/event08_01_CornetaToquedeOracion.wav','8_musica':'audio/event08_02_Oracion_CANTADA.mp3','8_leida':'audio/event08_03_VOZORACION.mp3'};function actualizarReloj(){const a=new Date();const h=-(a.getTimezoneOffset()/60);const l=['Y','X','W','V','U','Z','A','B','C','D','E','F','G','H','I','K','L','M'][h+12]||'Z';document.getElementById('reloj').textContent=String(a.getHours()).padStart(2,'0')+':'+String(a.getMinutes()).padStart(2,'0')+':'+String(a.getSeconds()).padStart(2,'0')+' '+l;}actualizarReloj();setInterval(actualizarReloj,1000);function updateDots(){document.getElementById('dotGuardiaSi').style.opacity=conGuardia?'1':'0.2';document.getElementById('dotGuardiaNo').style.opacity=conGuardia?'0.2':'1';document.getElementById('dotPresentenVoz').style.opacity=modalidadPresenten==='voz'?'1':'0.2';document.getElementById('dotPresentenCorneta').style.opacity=modalidadPresenten==='corneta'?'1':'0.2';document.getElementById('dotArriadoManual').style.opacity=arriado==='manual'?'1':'0.2';document.getElementById('dotArriadoOcaso').style.opacity=arriado==='ocaso'?'1':'0.2';document.getElementById('dotAcompHimno').style.opacity=acompañamiento==='himno'?'1':'0.2';document.getElementById('dotAcompChifle').style.opacity=acompañamiento==='chifle'?'1':'0.2';document.getElementById('dotAcompCorneta').style.opacity=acompañamiento==='corneta'?'1':'0.2';document.getElementById('dotAcompHimnoChifle').style.opacity=acompañamiento==='himno_chifle'?'1':'0.2';document.getElementById('dotOracionCorneta').style.opacity=oracion==='corneta'?'1':'0.2';document.getElementById('dotOracionMusica').style.opacity=oracion==='musica'?'1':'0.2';document.getElementById('dotOracionLeida').style.opacity=oracion==='leida'?'1':'0.2';document.getElementById('dotOracionNinguna').style.opacity=oracion==='ninguna'?'1':'0.2';}function setModo(m){modo=m;calcularPuntos();updateUI();document.getElementById('cardProgramacion').style.display='block';if(m==='izado'){document.getElementById('secHoraIzado').style.display='block';document.getElementById('secHoraArriado').style.display='none';}else{document.getElementById('secHoraIzado').style.display='none';document.getElementById('secHoraArriado').style.display='block';setArriado('manual');}document.getElementById('btnIzado').classList.toggle('primary');document.getElementById('btnArriado').classList.toggle('primary');}function setGuardia(g){conGuardia=g;calcularPuntos();updateUI();updateDots();}function setPresenten(p){modalidadPresenten=p;updateDots();calcularPuntos();}function setAcompañamiento(a){acompañamiento=a;calcularPuntos();updateUI();updateDots();}function setOracion(o){oracion=o;updateDots();}function setArriado(t){arriado=t;document.getElementById('secArriadoManualInput').style.display=t==='manual'?'block':'none';updateDots();}function setEjecucion(t){ejecucion=t;document.getElementById('secEjecAuto').style.display=t==='automatica'?'block':'none';document.getElementById('secEjecManual').style.display=t==='manual'?'block':'none';document.getElementById('btnEjecAuto').classList.toggle('primary');document.getElementById('btnEjecManual').classList.toggle('primary');}function calcularPuntos(){const h=(acompañamiento==='himno'||acompañamiento==='himno_chifle');cerPuntosActivosManualIAA=[];if(modo==='izado'){if(conGuardia){cerPuntosActivosManualIAA=[1,2,3,5,6,7];if(h)cerPuntosActivosManualIAA.splice(3,0,4);}else{cerPuntosActivosManualIAA=[1,5];if(h)cerPuntosActivosManualIAA.splice(1,0,4);}}else{if(conGuardia){cerPuntosActivosManualIAA=[1,2,3,5,6,7,8];if(h)cerPuntosActivosManualIAA.splice(3,0,4);}else{cerPuntosActivosManualIAA=[1,5,8];if(h)cerPuntosActivosManualIAA.splice(1,0,4);}}renderPuntos();}function renderPuntos(){const g=document.getElementById('puntosGrid');g.innerHTML='';for(let p of cerPuntosActivosManualIAA){const b=document.createElement('button');b.className='punto-btn';b.textContent='Punto '+p;b.onclick=()=>reproducirPunto(p);g.appendChild(b);}}function getAudioURL(p){if(p===1)return modo==='izado'?audioURLs['1_izado']:audioURLs['1_arriado'];if(p===3)return modalidadPresenten==='voz'?audioURLs['3_voz']:audioURLs['3_corneta'];if(p===5)return audioURLs['5_'+acompañamiento]||audioURLs['5_himno'];if(p===8){if(oracion==='ninguna')return '';if(oracion==='corneta')return audioURLs['8_corneta'];if(oracion==='musica')return audioURLs['8_musica'];if(oracion==='leida')return audioURLs['8_leida'];return '';}return audioURLs[p]||'';}function reproducirPunto(p){const u=getAudioURL(p);if(u){const a=document.getElementById('audioPlayer');a.src=u;a.play();document.getElementById('status').textContent='Punto '+p;}}function stopAll(){document.getElementById('audioPlayer').pause();document.getElementById('status').textContent='Detenido';}function iniciarAutomatica(){const h=document.getElementById('horaIzado').value;if(h){const[hr,m]=h.split(':');const t=new Date();t.setHours(parseInt(hr),parseInt(m),0);const i=setInterval(()=>{const d=t-new Date();if(d<=0){clearInterval(i);reproducirPunto(1);}},1000);}}function reproducirManualT5(){reproducirPunto(1);}function iniciarAuto(){if(cerPuntosActivosManualIAA.length>0){let i=0;const s=()=>{if(i>=cerPuntosActivosManualIAA.length){document.getElementById('status').textContent='✅ Secuencia completada';return;}reproducirPunto(cerPuntosActivosManualIAA[i]);i++;setTimeout(s,3000);};s();}else{document.getElementById('status').textContent='❌ No hay puntos activos';}}function updateUI(){document.getElementById('seccionPresenten').style.display=(conGuardia&&cerPuntosActivosManualIAA.includes(3))?'flex':'none';document.getElementById('seccionOracion').style.display=cerPuntosActivosManualIAA.includes(8)?'block':'none';}setArriado('manual');setEjecucion('automatica');setModo('izado');calcularPuntos();updateUI();updateDots();}</script></body></html>
